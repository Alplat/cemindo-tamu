<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Tamu - Cemindo</title>
<style>
  /* (Gunakan CSS yang sama seperti sebelumnya, saya persingkat di sini) */
  :root { --merah: #C00000; --bg-body: #F0F2F5; --bg-card: #FFFFFF; --bg-input: #FAFAFA; --border: #E2E8F0; --teks-utama: #333333; --teks-label: #475569; }
  body.dark-mode { --bg-body: #121212; --bg-card: #1E1E1E; --bg-input: #2D2D2D; --border: #404040; --teks-utama: #F1F1F1; --teks-label: #A0A0A0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); min-height: 100vh; padding: 20px; color: var(--teks-utama); transition: 0.4s; }
  .container { max-width: 550px; margin: 20px auto; background: var(--bg-card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); }
  .header-form { text-align: center; margin-bottom: 30px; }
  .header-form img { max-width: 130px; margin-bottom: 15px; }
  .header-form h2 { color: var(--merah); font-size: 22px; font-weight: 800; }
  .form-group { margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: var(--teks-label); }
  input, select, textarea { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--teks-utama); transition: 0.3s; background: var(--bg-input); }
  input:focus, select:focus, textarea:focus { border-color: var(--merah); background: var(--bg-card); outline: none; }
  .foto-box { display: flex; gap: 15px; }
  .foto-item { flex: 1; text-align: center; border: 2px dashed var(--border); padding: 20px; border-radius: 12px; cursor: pointer; background: var(--bg-input); }
  .foto-item img { width: 100%; height: 120px; object-fit: cover; display: none; border-radius: 8px; margin-bottom: 10px; }
  .foto-item span { font-size: 13px; color: var(--teks-label); font-weight: 600; display: block; }
  .btn-submit { width: 100%; background: var(--merah); color: #fff; border: none; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; }
  .hidden { display: none !important; }
  .sukses-box { text-align: center; padding: 60px 20px; }
  .sukses-icon { font-size: 90px; line-height: 1; margin-bottom: 20px; }
  .btn-print { background: var(--merah); color: #fff; border: none; padding: 12px 30px; border-radius: 8px; font-weight: bold; cursor: pointer; margin-top: 15px; font-size: 15px; }
  #badgeArea { display: none; }
  @media print {
    body * { visibility: hidden; }
    #badgeArea, #badgeArea * { visibility: visible; }
    #badgeArea { display: block !important; position: absolute; left: 0; top: 0; width: 10cm; height: 14cm; background: white; color: #333; border: 2px solid #C00000; border-radius: 15px; padding: 20px; text-align: center; }
    .badge-header { border-bottom: 2px solid #C00000; padding-bottom: 10px; margin-bottom: 15px; }
    .badge-header img { height: 40px; }
    .badge-header h2 { font-size: 16px; color: #C00000; margin: 0; }
    .badge-foto { width: 100px; height: 100px; border-radius: 50%; object-fit: cover; border: 3px solid #C00000; margin: 0 auto 10px auto; display: block; }
    .badge-nama { font-size: 22px; font-weight: 800; margin-bottom: 5px; color: #1E293B; }
    .badge-detail { text-align: left; background: #F8FAFC; padding: 15px; border-radius: 10px; margin-bottom: 20px; }
    .badge-detail table { width: 100%; font-size: 12px; }
    .badge-detail td { padding: 5px 0; border-bottom: 1px dashed #ccc; }
    .badge-detail td:first-child { color: #666; width: 40%; }
    .badge-detail td:last-child { font-weight: bold; color: #333; }
  }
</style>
</head>
<body>

  <button class="theme-toggle" id="themeBtn" onclick="toggleTheme()" style="position:fixed; top:20px; right:20px; background:var(--bg-card); border:2px solid var(--border); font-size:20px; padding:10px; border-radius:50%; cursor:pointer;">🌙</button>

  <div class="container" id="formContainer">
    <div class="header-form">
      <img src="/logo.png" alt="Logo Cemindo">
      <h2>Registrasi Tamu</h2>
    </div>
    
    <div class="form-group">
      <label>Nama Lengkap *</label>
      <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
    </div>
    <div class="form-group">
      <label>No ID Card / NIK *</label>
      <input type="text" id="nik" placeholder="Masukkan NIK" required>
    </div>

    <!-- UBAH INPUT PIC MENJADI DROPDOWN -->
    <div class="form-group">
      <label>PIC yang Dituju *</label>
      <select id="pic" onchange="ubahDepartemen()" required>
        <option value="">-- Pilih Karyawan --</option>
      </select>
    </div>

    <div class="form-group">
      <label>Departemen *</label>
      <!-- Departemen akan terisi otomatis dari pilihan PIC -->
      <input type="text" id="departemen" placeholder="Terisi otomatis" readonly style="background: #eee; cursor: not-allowed;">
    </div>

    <div class="form-group">
      <label>Keperluan *</label>
      <textarea id="keperluan" rows="3" placeholder="Contoh: Meeting, Interview, Kirim Barang"></textarea>
    </div>
    
    <div class="form-group">
      <label>Foto Selfie *</label>
      <div class="foto-box">
        <div class="foto-item" onclick="ambilFoto('selfie')">
          <img id="preview_selfie">
          <span id="text_selfie">📷 Ambil Selfie</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label>Foto KTP / ID Card *</label>
      <div class="foto-box">
        <div class="foto-item" onclick="ambilFoto('ktp')">
          <img id="preview_ktp">
          <span id="text_ktp">📷 Ambil KTP</span>
        </div>
      </div>
    </div>
    <button onclick="simpanData()" id="btnSimpan" class="btn-submit">Kirim Data Registrasi</button>
  </div>

  <!-- Tampilan Sukses & Badge (Sama seperti sebelumnya) -->
  <div class="container sukses-box hidden" id="suksesContainer">
    <div class="sukses-icon">✅</div>
    <h2 style="margin-bottom:10px;">Registrasi Berhasil!</h2>
    <p style="color:var(--teks-label); line-height:1.6; margin-bottom: 20px;">Terima kasih <b id="namaSukses"></b>.<br>Notifikasi WA telah dikirim ke PIC yang dituju.</p>
    <button class="btn-print" onclick="window.print()">🖨️ Cetak Visitor Badge</button>
    <br>
    <a href="/" style="display:inline-block; margin-top:15px; color:var(--teks-label); text-decoration:none; font-size:13px;">Kembali ke Halaman Depan</a>
  </div>

  <div id="badgeArea">
    <div class="badge-header">
      <img src="/logo.png" alt="Logo">
      <h2>PT. CEMINDO GEMILANG</h2>
    </div>
    <img id="badgeFoto" class="badge-foto" src="">
    <div class="badge-nama" id="badgeNama">Nama Tamu</div>
    <div class="badge-detail">
      <table>
        <tr><td>Tujuan (PIC)</td><td id="badgePic">-</td></tr>
        <tr><td>Departemen</td><td id="badgeDept">-</td></tr>
        <tr><td>Tanggal Masuk</td><td id="badgeTanggal">-</td></tr>
      </table>
    </div>
  </div>

  <!-- Modal Kamera -->
  <div id="kameraModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:99;">
    <div style="background:var(--bg-card); padding:20px; border-radius:20px; text-align:center; width:90%; max-width:450px;">
      <h3 style="margin-bottom:15px; color:var(--merah);" id="titleKamera">Ambil Foto</h3>
      <video id="video" autoplay playsinline style="width:100%; border-radius:12px; background:#000;"></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button onclick="tutupKamera()" style="flex:1; background:var(--bg-input); color:var(--teks-utama); border:none; padding:14px; border-radius:10px; font-weight:bold; cursor:pointer;">Batal</button>
        <button onclick="prosesFoto()" style="flex:1; background:var(--merah); color:#fff; border:none; padding:14px; border-radius:10px; font-weight:bold; cursor:pointer;">📸 Jepret</button>
      </div>
    </div>
  </div>

<script>
  // --- LOGIKA DARK MODE ---
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('themeBtn').innerText = '☀️';
  }
  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
  }

  // --- AMBIL DATA KARYAWAN UNTUK DROPDOWN ---
  let dataKaryawan = [];
  
  window.onload = async () => {
    try {
      const res = await fetch('/api/karyawan');
      dataKaryawan = await res.json();
      
      const selectPic = document.getElementById('pic');
      dataKaryawan.forEach(k => {
        const option = document.createElement('option');
        option.value = k.nama;
        option.text = `${k.nama} (${k.departemen})`;
        option.dataset.dept = k.departemen;
        selectPic.appendChild(option);
      });
    } catch (err) {
      console.error("Gagal load karyawan:", err);
    }
  };

  // Otomatis isi departemen saat PIC dipilih
  function ubahDepartemen() {
    const select = document.getElementById('pic');
    const selectedOption = select.options[select.selectedIndex];
    const deptInput = document.getElementById('departemen');
    
    if (selectedOption.value) {
      deptInput.value = selectedOption.dataset.dept;
    } else {
      deptInput.value = '';
    }
  }

  // --- LOGIKA FORM & KAMERA ---
  let fotoData = { selfie: null, ktp: null };
  let modeFoto = '';
  let stream = null;

  async function ambilFoto(jenis) {
    modeFoto = jenis;
    document.getElementById('titleKamera').innerText = jenis === 'selfie' ? '🤳 Ambil Foto Selfie' : '🪪 Ambil Foto KTP';
    document.getElementById('kameraModal').style.display = 'flex';
    try {
      const constraints = { video: { facingMode: jenis === 'selfie' ? 'user' : 'environment' } };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('video').srcObject = stream;
    } catch (err) {
      alert('Gagal akses kamera: ' + err.message);
      tutupKamera();
    }
  }

  function tutupKamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    document.getElementById('kameraModal').style.display = 'none';
  }

  function prosesFoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    const dataImage = canvas.toDataURL('image/jpeg', 0.8);
    fotoData[modeFoto] = dataImage;
    
    document.getElementById('preview_' + modeFoto).src = dataImage;
    document.getElementById('preview_' + modeFoto).style.display = 'block';
    document.getElementById('text_' + modeFoto).innerText = '✅ Tersimpan';
    document.getElementById('text_' + modeFoto).style.color = '#16A34A';
    tutupKamera();
  }

  async function simpanData() {
    const nama = document.getElementById('nama').value;
    const nik = document.getElementById('nik').value;
    const pic = document.getElementById('pic').value;
    const departemen = document.getElementById('departemen').value;
    const keperluan = document.getElementById('keperluan').value;

    if (!nama || !nik || !pic || !keperluan) {
      return alert('Mohon lengkapi semua data teks!');
    }
    if (!fotoData.selfie || !fotoData.ktp) {
      return alert('Mohon ambil Foto Selfie dan Foto KTP!');
    }

    const btn = document.getElementById('btnSimpan');
    btn.disabled = true;
    btn.innerText = 'Menyimpan & Mengirim WA...';

    try {
      const res = await fetch('/api/simpan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ nama, nik, pic, departemen, keperluan, foto_selfie: fotoData.selfie, foto_ktp: fotoData.ktp })
      });

      if (res.ok) {
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('suksesContainer').classList.remove('hidden');
        document.getElementById('namaSukses').innerText = nama;

        document.getElementById('badgeFoto').src = fotoData.selfie;
        document.getElementById('badgeNama').innerText = nama;
        document.getElementById('badgePic').innerText = pic;
        document.getElementById('badgeDept').innerText = departemen;
        document.getElementById('badgeTanggal').innerText = new Date().toLocaleDateString('id-ID', { weekday: 'long', day: 'numeric', month: 'long', year: 'numeric' });
      } else {
        alert('Gagal menyimpan data.');
        btn.disabled = false;
        btn.innerText = 'Kirim Data Registrasi';
      }
    } catch (err) {
      alert('Error: ' + err.message);
      btn.disabled = false;
      btn.innerText = 'Kirim Data Registrasi';
    }
  }
</script>
</body>
</html>
