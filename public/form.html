<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Formulir Tamu - Cemindo</title>
<style>
  :root { --merah: #C00000; --bg-body: #F0F2F5; --bg-card: #FFFFFF; --bg-input: #FAFAFA; --border: #E2E8F0; --teks-utama: #333333; --teks-label: #475569; }
  body.dark-mode { --bg-body: #121212; --bg-card: #1E1E1E; --bg-input: #2D2D2D; --border: #404040; --teks-utama: #F1F1F1; --teks-label: #A0A0A0; }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideUp { from { opacity: 0; transform: translateY(30px); } to { opacity: 1; transform: translateY(0); } }
  body { font-family: 'Segoe UI', sans-serif; background: var(--bg-body); min-height: 100vh; padding: 20px; color: var(--teks-utama); transition: 0.4s; }
  
  /* Tombol Toggle Bahasa & Tema */
  .top-controls { position: fixed; top: 20px; right: 20px; display: flex; gap: 10px; z-index: 100; }
  .btn-control { background: var(--bg-card); border: 2px solid var(--border); font-size: 14px; padding: 10px 15px; border-radius: 10px; cursor: pointer; transition: 0.3s; font-weight: bold; color: var(--teks-utama); display: flex; align-items: center; justify-content: center; }
  .btn-control:hover { border-color: var(--merah); transform: translateY(-2px); }
  
  .container { max-width: 550px; margin: 20px auto; background: var(--bg-card); padding: 40px; border-radius: 20px; box-shadow: 0 10px 30px rgba(0,0,0,0.05); animation: slideUp 0.6s ease-out; }
  .header-form { text-align: center; margin-bottom: 30px; }
  .header-form img { max-width: 130px; margin-bottom: 15px; }
  .header-form h2 { color: var(--merah); font-size: 22px; font-weight: 800; }
  
  .form-group { margin-bottom: 20px; }
  label { display: block; font-weight: 600; margin-bottom: 8px; font-size: 13px; color: var(--teks-label); }
  input, select, textarea { width: 100%; padding: 14px; border: 2px solid var(--border); border-radius: 10px; font-size: 14px; color: var(--teks-utama); transition: 0.3s; background: var(--bg-input); font-family: inherit; }
  input:focus, select:focus, textarea:focus { border-color: var(--merah); background: var(--bg-card); outline: none; }
  
  select:disabled { background: #e9ecef; cursor: not-allowed; color: #999; }
  body.dark-mode select:disabled { background: #1a1a1a; }

  .foto-box { display: flex; gap: 15px; }
  .foto-item { flex: 1; text-align: center; border: 2px dashed var(--border); padding: 20px; border-radius: 12px; cursor: pointer; background: var(--bg-input); }
  .foto-item img { width: 100%; height: 120px; object-fit: cover; display: none; border-radius: 8px; margin-bottom: 10px; }
  .foto-item span { font-size: 13px; color: var(--teks-label); font-weight: 600; display: block; }
  
  .btn-submit { width: 100%; background: var(--merah); color: #fff; border: none; padding: 18px; border-radius: 12px; font-size: 16px; font-weight: 700; cursor: pointer; margin-top: 20px; transition: 0.3s; }
  .btn-submit:hover { background: #900000; }
  .hidden { display: none !important; }
  
  /* Sukses Box */
  .sukses-box { text-align: center; padding: 60px 20px; }
  .sukses-icon { font-size: 90px; line-height: 1; margin-bottom: 20px; }
  
  .btn-back { 
    display: inline-block; background: #E2E8F0; color: #333; 
    padding: 14px 30px; border-radius: 10px; text-decoration: none; 
    font-weight: bold; font-size: 15px; transition: 0.3s; margin-top: 15px;
    border: 2px solid #CBD5E1;
  }
  .btn-back:hover { background: #CBD5E1; transform: translateY(-2px); }
</style>
</head>
<body>

  <!-- Tombol Kontrol (Bahasa & Tema) -->
  <div class="top-controls">
    <button class="btn-control" id="langBtn" onclick="toggleLanguage()">🇬🇧 EN</button>
    <button class="btn-control" id="themeBtn" onclick="toggleTheme()">🌙</button>
  </div>

  <div class="container" id="formContainer">
    <div class="header-form">
      <img src="/logo.png" alt="Logo Cemindo">
      <h2 id="titleText">Registrasi Tamu</h2>
    </div>
    
    <div class="form-group">
      <label id="lblNama">Nama Lengkap *</label>
      <input type="text" id="nama" placeholder="Masukkan nama lengkap" required>
    </div>
    <div class="form-group">
      <label id="lblNik">No ID Card / NIK *</label>
      <input type="text" id="nik" placeholder="Masukkan NIK" required>
    </div>

    <div class="form-group">
      <label id="lblDept">Departemen yang Dituju *</label>
      <select id="departemen" onchange="filterPIC()" required>
        <option value="">-- Pilih Departemen --</option>
        <option value="HRD">HRD</option>
        <option value="Produksi">Produksi</option>
        <option value="IT">IT</option>
        <option value="Finance">Finance</option>
        <option value="Logistik">Logistik</option>
        <option value="Lainnya">Lainnya</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lblPic">PIC yang Dituju *</label>
      <select id="pic" required disabled>
        <option value="">-- Pilih Departemen Terlebih Dahulu --</option>
      </select>
    </div>

    <div class="form-group">
      <label id="lblKeperluan">Keperluan *</label>
      <textarea id="keperluan" rows="3" placeholder="Contoh: Meeting, Interview, Kirim Barang"></textarea>
    </div>
    
    <div class="form-group">
      <label id="lblSelfie">Foto Selfie *</label>
      <div class="foto-box">
        <div class="foto-item" onclick="ambilFoto('selfie')">
          <img id="preview_selfie">
          <span id="text_selfie">📷 Ambil Selfie</span>
        </div>
      </div>
    </div>
    <div class="form-group">
      <label id="lblKtp">Foto KTP / ID Card *</label>
      <div class="foto-box">
        <div class="foto-item" onclick="ambilFoto('ktp')">
          <img id="preview_ktp">
          <span id="text_ktp">📷 Ambil KTP</span>
        </div>
      </div>
    </div>
    <button onclick="simpanData()" id="btnSimpan" class="btn-submit">Kirim Data Registrasi</button>
  </div>

  <!-- Tampilan Sukses -->
  <div class="container sukses-box hidden" id="suksesContainer">
    <div class="sukses-icon">✅</div>
    <h2 style="margin-bottom:10px;" id="suksesTitle">Registrasi Berhasil!</h2>
    <p style="color:var(--teks-label); line-height:1.6; margin-bottom: 25px;" id="suksesText">
      Terima kasih <b id="namaSukses"></b>.<br>
      Notifikasi WA telah dikirim ke PIC.<br>
      Silakan menunggu di resepsionis.
    </p>
    
    <a href="/" class="btn-back" id="btnKembali">
      ⬅️ Kembali ke Halaman Depan
    </a>
  </div>

  <!-- Modal Kamera -->
  <div id="kameraModal" style="position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:99;">
    <div style="background:var(--bg-card); padding:20px; border-radius:20px; text-align:center; width:90%; max-width:450px;">
      <h3 style="margin-bottom:15px; color:var(--merah);" id="titleKamera">Ambil Foto</h3>
      <video id="video" autoplay playsinline style="width:100%; border-radius:12px; background:#000;"></video>
      <canvas id="canvas" style="display:none;"></canvas>
      <div style="display:flex; gap:10px; margin-top:20px;">
        <button onclick="tutupKamera()" style="flex:1; background:var(--bg-input); color:var(--teks-utama); border:none; padding:14px; border-radius:10px; font-weight:bold; cursor:pointer;" id="btnBatalKamera">Batal</button>
        <button onclick="prosesFoto()" style="flex:1; background:var(--merah); color:#fff; border:none; padding:14px; border-radius:10px; font-weight:bold; cursor:pointer;" id="btnJepret">📸 Jepret</button>
      </div>
    </div>
  </div>

<script>
  // --- LOGIKA MULTI-BAHASA ---
  let currentLang = localStorage.getItem('lang') || 'id';

  const translations = {
    id: {
      langBtn: "🇬🇧 EN",
      title: "Registrasi Tamu",
      lblNama: "Nama Lengkap *",
      phNama: "Masukkan nama lengkap",
      lblNik: "No ID Card / NIK *",
      phNik: "Masukkan NIK",
      lblDept: "Departemen yang Dituju *",
      optDept: "-- Pilih Departemen --",
      lblPic: "PIC yang Dituju *",
      optPic: "-- Pilih Departemen Terlebih Dahulu --",
      lblKeperluan: "Keperluan *",
      phKeperluan: "Contoh: Meeting, Interview, Kirim Barang",
      lblSelfie: "Foto Selfie *",
      txtSelfie: "📷 Ambil Selfie",
      lblKtp: "Foto KTP / ID Card *",
      txtKtp: "📷 Ambil KTP",
      btnSubmit: "Kirim Data Registrasi",
      btnBack: "⬅️ Kembali ke Halaman Depan",
      suksesTitle: "Registrasi Berhasil!",
      suksesText: "Terima kasih. Notifikasi WA telah dikirim ke PIC. Silakan menunggu di resepsionis.",
      titleKamera: "Ambil Foto",
      btnBatal: "Batal",
      btnJepret: "📸 Jepret"
    },
    en: {
      langBtn: "🇮🇩 ID",
      title: "Guest Registration",
      lblNama: "Full Name *",
      phNama: "Enter full name",
      lblNik: "ID Card / Passport No *",
      phNik: "Enter ID Number",
      lblDept: "Destination Department *",
      optDept: "-- Select Department --",
      lblPic: "Person In Charge (PIC) *",
      optPic: "-- Select Department First --",
      lblKeperluan: "Purpose of Visit *",
      phKeperluan: "Example: Meeting, Interview, Delivery",
      lblSelfie: "Selfie Photo *",
      txtSelfie: "📷 Take Selfie",
      lblKtp: "ID Card / Passport Photo *",
      txtKtp: "📷 Take ID Photo",
      btnSubmit: "Submit Registration",
      btnBack: "⬅️ Back to Homepage",
      suksesTitle: "Registration Successful!",
      suksesText: "Thank you. WhatsApp notification has been sent to the PIC. Please wait at the receptionist.",
      titleKamera: "Take Photo",
      btnBatal: "Cancel",
      btnJepret: "📸 Capture"
    }
  };

  function applyLanguage() {
    const t = translations[currentLang];
    document.getElementById('langBtn').innerText = t.langBtn;
    document.getElementById('titleText').innerText = t.title;
    document.getElementById('lblNama').innerText = t.lblNama;
    document.getElementById('nama').placeholder = t.phNama;
    document.getElementById('lblNik').innerText = t.lblNik;
    document.getElementById('nik').placeholder = t.phNik;
    document.getElementById('lblDept').innerText = t.lblDept;
    document.getElementById('departemen').options[0].text = t.optDept;
    
    document.getElementById('lblPic').innerText = t.lblPic;
    const picSelect = document.getElementById('pic');
    if (picSelect.disabled) {
      picSelect.options[0].text = t.optPic;
    } else {
      picSelect.options[0].text = currentLang === 'id' ? "-- Pilih Karyawan --" : "-- Select Employee --";
    }

    document.getElementById('lblKeperluan').innerText = t.lblKeperluan;
    document.getElementById('keperluan').placeholder = t.phKeperluan;
    document.getElementById('lblSelfie').innerText = t.lblSelfie;
    
    // Jangan timpa teks "Tersimpan" jika foto sudah diambil
    if (document.getElementById('preview_selfie').style.display !== 'block') {
      document.getElementById('text_selfie').innerText = t.txtSelfie;
    }
    document.getElementById('lblKtp').innerText = t.lblKtp;
    if (document.getElementById('preview_ktp').style.display !== 'block') {
      document.getElementById('text_ktp').innerText = t.txtKtp;
    }
    
    document.getElementById('btnSimpan').innerText = t.btnSubmit;
    document.getElementById('btnKembali').innerText = t.btnBack;
    document.getElementById('suksesTitle').innerText = t.suksesTitle;
    document.getElementById('suksesText').innerHTML = `${t.suksesText.split('.')[0]}.<br>${t.suksesText.split('.')[1]}.<br>${t.suksesText.split('.')[2] || ''}`;
    
    document.getElementById('titleKamera').innerText = t.titleKamera;
    document.getElementById('btnBatalKamera').innerText = t.btnBatal;
    document.getElementById('btnJepret').innerText = t.btnJepret;
  }

  function toggleLanguage() {
    currentLang = currentLang === 'id' ? 'en' : 'id';
    localStorage.setItem('lang', currentLang);
    applyLanguage();
  }

  // --- LOGIKA DARK MODE ---
  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    document.getElementById('themeBtn').innerText = '☀️';
  }
  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    document.getElementById('themeBtn').innerText = isDark ? '☀️' : '🌙';
  }

  // --- AMBIL DATA KARYAWAN ---
  let dataKaryawan = [];
  window.onload = async () => {
    applyLanguage(); // Terapkan bahasa saat halaman dimuat
    try {
      const res = await fetch('/api/karyawan');
      dataKaryawan = await res.json();
    } catch (err) {
      console.error("Gagal load karyawan:", err);
    }
  };

  // --- FILTER DEPARTEMEN KE PIC ---
  function filterPIC() {
    const deptTerpilih = document.getElementById('departemen').value;
    const selectPic = document.getElementById('pic');
    const t = translations[currentLang];
    
    selectPic.innerHTML = `<option value="">${currentLang === 'id' ? '-- Pilih Karyawan --' : '-- Select Employee --'}</option>`;
    
    if (deptTerpilih) {
      const karyawanFiltered = dataKaryawan.filter(k => k.departemen === deptTerpilih);
      
      if (karyawanFiltered.length > 0) {
        karyawanFiltered.forEach(k => {
          const option = document.createElement('option');
          option.value = k.nama;
          option.text = k.nama;
          selectPic.appendChild(option);
        });
        selectPic.disabled = false;
      } else {
        selectPic.innerHTML = `<option value="">${currentLang === 'id' ? '-- Tidak ada karyawan --' : '-- No employee found --'}</option>`;
        selectPic.disabled = true;
      }
    } else {
      selectPic.innerHTML = `<option value="">${t.optPic}</option>`;
      selectPic.disabled = true;
    }
  }

  // --- LOGIKA FORM & KAMERA ---
  let fotoData = { selfie: null, ktp: null };
  let modeFoto = '';
  let stream = null;

  async function ambilFoto(jenis) {
    modeFoto = jenis;
    const t = translations[currentLang];
    document.getElementById('titleKamera').innerText = jenis === 'selfie' ? (currentLang === 'id' ? '🤳 Ambil Foto Selfie' : '🤳 Take Selfie Photo') : (currentLang === 'id' ? '🪪 Ambil Foto KTP' : '🪪 Take ID Photo');
    
    document.getElementById('kameraModal').style.display = 'flex';
    try {
      const constraints = { video: { facingMode: jenis === 'selfie' ? 'user' : 'environment' } };
      stream = await navigator.mediaDevices.getUserMedia(constraints);
      document.getElementById('video').srcObject = stream;
    } catch (err) {
      alert('Gagal akses kamera / Camera access failed: ' + err.message);
      tutupKamera();
    }
  }

  function tutupKamera() {
    if (stream) stream.getTracks().forEach(t => t.stop());
    document.getElementById('kameraModal').style.display = 'none';
  }

  function prosesFoto() {
    const video = document.getElementById('video');
    const canvas = document.getElementById('canvas');
    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    canvas.getContext('2d').drawImage(video, 0, 0);
    
    const dataImage = canvas.toDataURL('image/jpeg', 0.8);
    fotoData[modeFoto] = dataImage;
    
    document.getElementById('preview_' + modeFoto).src = dataImage;
    document.getElementById('preview_' + modeFoto).style.display = 'block';
    document.getElementById('text_' + modeFoto).innerText = currentLang === 'id' ? '✅ Tersimpan' : '✅ Saved';
    document.getElementById('text_' + modeFoto).style.color = '#16A34A';
    tutupKamera();
  }

  async function simpanData() {
    const t = translations[currentLang];
    const nama = document.getElementById('nama').value;
    const nik = document.getElementById('nik').value;
    const dept = document.getElementById('departemen').value;
    const pic = document.getElementById('pic').value;
    const keperluan = document.getElementById('keperluan').value;

    if (!nama || !nik || !dept || !pic || !keperluan) {
      return alert(currentLang === 'id' ? 'Mohon lengkapi semua data teks!' : 'Please complete all text fields!');
    }
    if (!fotoData.selfie || !fotoData.ktp) {
      return alert(currentLang === 'id' ? 'Mohon ambil Foto Selfie dan Foto KTP!' : 'Please take Selfie and ID Card photos!');
    }

    const btn = document.getElementById('btnSimpan');
    btn.disabled = true;
    btn.innerText = currentLang === 'id' ? 'Menyimpan...' : 'Saving...';

    try {
      const res = await fetch('/api/simpan', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ 
          nama, nik, pic, departemen: dept, keperluan, 
          foto_selfie: fotoData.selfie, foto_ktp: fotoData.ktp 
        })
      });

      if (res.ok) {
        document.getElementById('formContainer').classList.add('hidden');
        document.getElementById('suksesContainer').classList.remove('hidden');
        document.getElementById('namaSukses').innerText = nama;
      } else {
        alert('Gagal menyimpan data / Failed to save data.');
        btn.disabled = false;
        btn.innerText = t.btnSubmit;
      }
    } catch (err) {
      alert('Error: ' + err.message);
      btn.disabled = false;
      btn.innerText = t.btnSubmit;
    }
  }
</script>
</body>
</html>
