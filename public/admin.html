<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Admin Dashboard - Cemindo</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  :root {
    --merah: #C00000; --merah-hover: #900000; --bg-body: #F0F2F5;
    --bg-card: #FFFFFF; --bg-input: #F8FAFC; --border: #E2E8F0;
    --teks-utama: #1E293B; --teks-sub: #475569; --header-bg: #1E293B;
  }
  body.dark-mode {
    --bg-body: #121212; --bg-card: #1E1E1E; --bg-input: #2D2D2D;
    --border: #404040; --teks-utama: #F1F1F1; --teks-sub: #A0A0A0; --header-bg: #0F172A;
  }
  * { margin:0; padding:0; box-sizing:border-box; }
  @keyframes fadeIn { from { opacity: 0; } to { opacity: 1; } }
  @keyframes slideDown { from { transform: translateY(-20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  @keyframes slideUp { from { transform: translateY(20px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }

  body { font-family:'Segoe UI', system-ui, sans-serif; background:var(--bg-body); color:var(--teks-utama); transition: background 0.4s ease, color 0.4s ease; }
  
  .theme-toggle { background: transparent; border: none; font-size: 20px; cursor: pointer; color: #fff; margin-left: 15px; transition: 0.3s; }
  .theme-toggle:hover { transform: scale(1.2) rotate(15deg); }
  
  /* Notifikasi Melayang */
  .notif-toast {
    position: fixed; top: 20px; right: 20px; background: #16A34A; color: white; 
    padding: 15px 25px; border-radius: 8px; box-shadow: 0 10px 25px rgba(0,0,0,0.2); 
    display: flex; align-items: center; gap: 15px; z-index: 9999; font-weight: bold;
    transform: translateX(150%); transition: transform 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
  }
  .notif-toast.show { transform: translateX(0); }
  .notif-toast button { background: white; color: #16A34A; border: none; padding: 5px 10px; border-radius: 5px; cursor: pointer; font-weight: bold; }

  /* Header Dashboard */
  .header { background:var(--header-bg); color:#fff; padding:15px 30px; display:flex; justify-content:space-between; align-items:center; animation: slideDown 0.5s ease-out; box-shadow: 0 4px 20px rgba(0,0,0,0.15); position: sticky; top: 0; z-index: 10; transition: background 0.4s ease; }
  .header-left { display:flex; align-items:center; gap:15px; }
  .header img { height: 40px; background:#fff; padding:5px; border-radius:8px; }
  .header h1 { margin:0; font-size:18px; letter-spacing:1px; font-weight: 700;}
  .header-right { display:flex; align-items:center; }
  .btn-logout { background:var(--merah); color:#fff; border:none; padding:8px 16px; border-radius:8px; cursor:pointer; font-weight:bold; transition: 0.3s; }
  .btn-logout:hover { background:var(--merah-hover); transform: scale(1.05); }
  
  .container { padding:30px; max-width:1200px; margin:0 auto; animation: fadeIn 0.8s ease-out; }
  
  /* Login Box */
  .login-wrapper { display:flex; justify-content:center; align-items:center; height:100vh; }
  .login-box { background:var(--bg-card); padding:45px 35px; border-radius:20px; max-width:380px; width:100%; box-shadow:0 20px 40px rgba(0,0,0,0.08); text-align:center; animation: slideUp 0.6s ease-out; transition: background 0.4s ease; }
  .login-box img { max-width: 140px; margin-bottom: 20px; }
  .login-box h2 { color:var(--teks-utama); margin-bottom:30px; font-weight: 800; font-size: 22px;}
  .login-box input { width:100%; padding:14px; margin-bottom:15px; border:2px solid var(--border); border-radius:10px; box-sizing:border-box; transition: 0.3s; background:var(--bg-input); font-size: 14px; color: var(--teks-utama); }
  .login-box input:focus { border-color:var(--merah); outline:none; background: var(--bg-card); }
  .login-box button { width:100%; padding:14px; background:var(--merah); color:#fff; border:none; border-radius:10px; font-weight:bold; cursor:pointer; transition: 0.3s; font-size: 15px; }
  .login-box button:hover { background:var(--merah-hover); transform: translateY(-2px); }

  /* Dashboard Elements */
  .chart-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(300px, 1fr)); gap: 20px; margin-bottom: 25px; animation: slideUp 0.5s ease-out; }
  .chart-card { background: var(--bg-card); padding: 20px; border-radius: 12px; box-shadow: 0 4px 15px rgba(0,0,0,0.03); transition: background 0.4s ease; }
  .chart-card h3 { font-size: 14px; color: var(--teks-sub); margin-bottom: 15px; text-align: center; font-weight: 600; }

  .filter-box { background:var(--bg-card); padding:20px; border-radius:12px; margin-bottom:25px; display:flex; gap:15px; align-items:center; flex-wrap:wrap; box-shadow:0 4px 15px rgba(0,0,0,0.03); border-left: 5px solid var(--merah); animation: slideUp 0.6s ease-out; transition: background 0.4s ease; }
  .filter-box select, .filter-box input { padding:10px 14px; border:2px solid var(--border); border-radius:8px; font-family: inherit; transition: 0.3s; background: var(--bg-input); color: var(--teks-utama); }
  .filter-box select:focus, .filter-box input:focus { border-color: var(--merah); outline:none;}
  .btn-export { background:#16A34A; color:#fff; border:none; padding:10px 20px; border-radius:8px; cursor:pointer; margin-left:auto; font-weight:bold; transition: 0.3s; display:flex; align-items:center; gap:8px; }
  .btn-export:hover { background:#15803D; transform: translateY(-2px); box-shadow: 0 6px 15px rgba(22, 163, 74, 0.3);}
  
  /* Tabel */
  .table-responsive { overflow-x:auto; background:var(--bg-card); border-radius:12px; box-shadow:0 4px 15px rgba(0,0,0,0.03); animation: fadeIn 1s ease-out; transition: background 0.4s ease; }
  table { width:100%; border-collapse:collapse; }
  th, td { padding:16px; text-align:left; border-bottom:1px solid var(--border); font-size:14px;}
  th { background:var(--bg-input); color:var(--teks-sub); font-weight:700; letter-spacing: 0.5px;}
  tr { transition: background 0.2s; }
  tr:hover { background:var(--bg-input); }
  .foto-tamu { width:50px; height:50px; object-fit:cover; border-radius:8px; cursor:pointer; border:2px solid transparent; transition: all 0.2s; }
  .foto-tamu:hover { border-color: var(--merah); transform: scale(1.15); box-shadow: 0 4px 10px rgba(0,0,0,0.15); }
  #modalFoto { position:fixed; inset:0; background:rgba(0,0,0,0.9); display:none; justify-content:center; align-items:center; z-index:99; animation: fadeIn 0.3s; backdrop-filter: blur(5px); }
  #modalFoto img { max-width:90%; max-height:90%; border-radius:12px; box-shadow: 0 20px 50px rgba(0,0,0,0.5);}
  .hidden { display:none !important; }
</style>
</head>
<body>
  <!-- Suara Notifikasi (Aktifkan suara dengan klik di layar) -->
  <audio id="suaraNotif" src="https://actions.google.com/sounds/v1/alarms/beep_short.ogg" preload="auto"></audio>

<!-- LOGIN SECTION -->
<div id="loginSection" class="login-wrapper">
  <button class="theme-toggle" style="position:fixed; top:20px; right:20px; color:#333;" id="themeBtnLogin" onclick="toggleTheme()">🌙</button>
  <div class="login-box">
    <img src="/logo.png" alt="Logo Cemindo">
    <h2>Admin Portal</h2>
    <input type="text" id="user" placeholder="Username">
    <input type="password" id="pass" placeholder="Password">
    <button onclick="login()">Masuk ke Dashboard</button>
  </div>
</div>

<!-- DASHBOARD SECTION -->
<div id="dashboardSection" class="hidden">
  <div class="header">
    <div class="header-left">
      <img src="/logo.png" alt="Logo">
      <h1>CEMINDO Guest Book</h1>
    </div>
    <div class="header-right">
      <button class="theme-toggle" id="themeBtnAdmin" onclick="toggleTheme()">🌙</button>
      <button class="btn-logout" onclick="logout()">Logout</button>
    </div>
  </div>
  
  <div class="container">
    <!-- DASHBOARD GRAFIK -->
    <div class="chart-grid">
      <div class="chart-card">
        <h3>Tamu 7 Hari Terakhir</h3>
        <canvas id="chartHarian"></canvas>
      </div>
      <div class="chart-card">
        <h3>Tujuan Departemen</h3>
        <canvas id="chartDepartemen"></canvas>
      </div>
    </div>

    <div class="filter-box">
      <label style="font-weight:bold; font-size:14px;">Filter Data:</label>
      <select id="filterType" onchange="toggleFilter()">
        <option value="semua">Semua Data</option>
        <option value="bulan">Per Bulan</option>
        <option value="tanggal">Per Tanggal</option>
      </select>
      <input type="month" id="inputBulan" class="hidden" onchange="loadData()">
      <input type="date" id="inputTanggal" class="hidden" onchange="loadData()">
      <button class="btn-export" onclick="exportExcel()">📊 Export Excel</button>
    </div>

    <div class="table-responsive">
      <table>
        <thead>
          <tr>
            <th>No</th>
            <th>Tanggal & Hari</th>
            <th>Nama Tamu</th>
            <th>NIK</th>
            <th>PIC & Dept</th>
            <th>Keperluan</th>
            <th>Foto</th>
          </tr>
        </thead>
        <tbody id="tabelData"></tbody>
      </table>
    </div>
  </div>
</div>

<!-- MODAL FOTO -->
<div id="modalFoto" onclick="this.style.display='none'">
  <img id="imgModal" src="">
</div>

<script>
  // --- LOGIKA DARK MODE ---
  function updateButtons(isDark) {
    const text = isDark ? '☀️' : '🌙';
    if(document.getElementById('themeBtnLogin')) document.getElementById('themeBtnLogin').innerText = text;
    if(document.getElementById('themeBtnAdmin')) document.getElementById('themeBtnAdmin').innerText = text;
    
    if(!isDark && document.getElementById('themeBtnLogin')) {
        document.getElementById('themeBtnLogin').style.color = '#333';
    } else if(document.getElementById('themeBtnLogin')) {
        document.getElementById('themeBtnLogin').style.color = '#fff';
    }
    if (!document.getElementById('dashboardSection').classList.contains('hidden')) {
      loadCharts();
    }
  }

  if (localStorage.getItem('theme') === 'dark') {
    document.body.classList.add('dark-mode');
    updateButtons(true);
  }

  function toggleTheme() {
    document.body.classList.toggle('dark-mode');
    const isDark = document.body.classList.contains('dark-mode');
    localStorage.setItem('theme', isDark ? 'dark' : 'light');
    updateButtons(isDark);
  }

  // --- LOGIKA ADMIN ---
  let lastCount = 0;
  let isLoggedIn = false;

  window.onload = () => { cekStatusLogin(); };

  async function cekStatusLogin() {
    const res = await fetch('/api/data');
    if (res.ok) {
      isLoggedIn = true;
      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      
      const initialData = await res.json();
      lastCount = initialData.length; 
      
      loadData();
      loadCharts();
    }
  }

  async function login() {
    const username = document.getElementById('user').value;
    const password = document.getElementById('pass').value;
    
    const res = await fetch('/api/login', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ username, password })
    });

    if (res.ok) {
      isLoggedIn = true;
      const cekData = await fetch('/api/data');
      const initialData = await cekData.json();
      lastCount = initialData.length;

      document.getElementById('loginSection').classList.add('hidden');
      document.getElementById('dashboardSection').classList.remove('hidden');
      loadData();
      loadCharts();
    } else {
      alert('Username atau Password salah!');
    }
  }

  async function logout() {
    isLoggedIn = false;
    await fetch('/api/logout', { method: 'POST' });
    location.reload();
  }

  function toggleFilter() {
    const type = document.getElementById('filterType').value;
    document.getElementById('inputBulan').classList.add('hidden');
    document.getElementById('inputTanggal').classList.add('hidden');

    if (type === 'bulan') {
      document.getElementById('inputBulan').classList.remove('hidden');
    } else if (type === 'tanggal') {
      document.getElementById('inputTanggal').classList.remove('hidden');
    }
    loadData();
  }

  async function loadData() {
    const type = document.getElementById('filterType').value;
    const bulan = document.getElementById('inputBulan').value;
    const tanggal = document.getElementById('inputTanggal').value;

    let url = `/api/data?filter_type=${type}&bulan=${bulan}&tanggal=${tanggal}`;
    const res = await fetch(url);
    const data = await res.json();

    const tbody = document.getElementById('tabelData');
    tbody.innerHTML = '';

    if (data.length === 0) {
      tbody.innerHTML = '<tr><td colspan="7" style="text-align:center; padding:40px; color:var(--teks-sub);">Tidak ada data ditemukan pada filter ini.</td></tr>';
      return;
    }

    data.forEach((row, index) => {
      const tr = document.createElement('tr');
      tr.innerHTML = `
        <td>${index + 1}</td>
        <td><b>${row.tanggal}</b><br><small style="color:var(--teks-sub)">${row.hari}</small></td>
        <td><b>${row.nama}</b></td>
        <td>${row.nik}</td>
        <td><span style="color:var(--merah); font-weight:700;">${row.pic}</span><br><small style="color:var(--teks-sub)">${row.departemen}</small></td>
        <td>${row.keperluan}</td>
        <td>
          ${row.foto_selfie ? `<img src="/uploads/${row.foto_selfie}" class="foto-tamu" onclick="lihatFoto(this.src)" title="Foto Selfie">` : '-'}
          ${row.foto_ktp ? `<img src="/uploads/${row.foto_ktp}" class="foto-tamu" onclick="lihatFoto(this.src)" title="Foto KTP" style="margin-left:8px">` : ''}
        </td>
      `;
      tbody.appendChild(tr);
    });
  }

  function lihatFoto(src) {
    document.getElementById('imgModal').src = src;
    document.getElementById('modalFoto').style.display = 'flex';
  }

  function exportExcel() {
    const type = document.getElementById('filterType').value;
    const bulan = document.getElementById('inputBulan').value;
    const tanggal = document.getElementById('inputTanggal').value;
    window.location.href = `/api/export?filter_type=${type}&bulan=${bulan}&tanggal=${tanggal}`;
  }

  // --- LOGIKA GRAFIK CHART.JS ---
  let myChartHarian = null;
  let myChartDept = null;

  async function loadCharts() {
    try {
      const res = await fetch('/api/stats');
      if (!res.ok) return;
      
      const data = await res.json();
      const isDark = document.body.classList.contains('dark-mode');
      const textColor = isDark ? '#A0A0A0' : '#475569';
      const gridColor = isDark ? '#404040' : '#E2E8F0';

      const ctxHarian = document.getElementById('chartHarian').getContext('2d');
      if (myChartHarian) myChartHarian.destroy();

      myChartHarian = new Chart(ctxHarian, {
        type: 'bar',
        data: {
          labels: data.harian.map(d => d.tanggal),
          datasets: [{
            label: 'Jumlah Tamu',
            data: data.harian.map(d => d.jumlah),
            backgroundColor: '#C00000',
            borderRadius: 5
          }]
        },
        options: {
          responsive: true,
          plugins: { legend: { display: false } },
          scales: {
            y: { beginAtZero: true, ticks: { stepSize: 1, color: textColor }, grid: { color: gridColor } },
            x: { ticks: { color: textColor }, grid: { display: false } }
          }
        }
      });

      const ctxDept = document.getElementById('chartDepartemen').getContext('2d');
      if (myChartDept) myChartDept.destroy();

      myChartDept = new Chart(ctxDept, {
        type: 'doughnut',
        data: {
          labels: data.departemen.map(d => d.departemen),
          datasets: [{
            data: data.departemen.map(d => d.jumlah),
            backgroundColor: ['#C00000', '#1E293B', '#64748B', '#E2E8F0', '#900000'],
            borderWidth: isDark ? 2 : 1,
            borderColor: isDark ? '#1E1E1E' : '#FFFFFF'
          }]
        },
        options: {
          responsive: true,
          plugins: {
            legend: { position: 'bottom', labels: { color: textColor, font: { size: 11 } } }
          },
          cutout: '65%'
        }
      });

    } catch (err) {
      console.error("Gagal memuat grafik:", err);
    }
  }

  // --- LOGIKA REAL-TIME ALERT ---
  function cekTamuBaru() {
    if (!isLoggedIn) return;

    fetch('/api/data')
      .then(res => res.json())
      .then(data => {
        if (lastCount > 0 && data.length > lastCount) {
          const audio = document.getElementById('suaraNotif');
          audio.play().catch(e => console.log("Suara diblokir browser"));
          tampilkanNotif(data.length - lastCount);
          loadData();
          loadCharts();
        }
        lastCount = data.length;
      })
      .catch(err => console.error(err));
  }

  function tampilkanNotif(jumlahBaru) {
    const oldNotif = document.querySelector('.notif-toast');
    if (oldNotif) oldNotif.remove();

    const div = document.createElement('div');
    div.className = 'notif-toast';
    div.innerHTML = `
      <span>🔔 Ada ${jumlahBaru} tamu baru!</span>
      <button onclick="this.parentElement.remove(); loadData();">Lihat</button>
    `;
    document.body.appendChild(div);
    
    setTimeout(() => div.classList.add('show'), 100);
    setTimeout(() => {
      if(div.parentElement) {
        div.classList.remove('show');
        setTimeout(() => div.remove(), 400);
      }
    }, 5000);
  }

  // Cek data baru setiap 10 detik
  setInterval(cekTamuBaru, 10000);
</script>
</body>
</html>
